name: Check Icarus setup action

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Icarus
        uses: daxzio/setup-icarus@v1
        with:
          version: "2026.11.04"
      - name: Report Icarus
        run: |
          which iverilog
          iverilog -V