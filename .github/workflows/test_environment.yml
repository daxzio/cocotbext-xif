name: Check cached Setup

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check_verilator:
    runs-on: ubuntu-26.04
    steps:
      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v2
        with:
          version: 5.050
      - name: Report Verilator
        run: verilator --version

  check_icarus:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Icarus
        uses: daxzio/setup-icarus@v1
        with:
          version: "2026.11.04"
      - name: Report Icarus
        run: |
          which iverilog
          iverilog -V