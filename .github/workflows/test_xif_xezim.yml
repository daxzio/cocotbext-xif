name: Test cocotbext-xif (xezim)

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  xif_xezim:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    # setup-xezim publishes ubuntu-24.04 assets (PeakRDL-etana pattern).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Setup xezim
        uses: daxzio/setup-xezim@v1
      - name: Report xezim
        run: xezim -V
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install -e .
      - name: Patch cocotb with the xezim simulator makefile
        run: |
          dest="$(cocotb-config --makefiles)/simulators"
          cp .github/xezim/Makefile.xezim "${dest}/Makefile.xezim"
          test -f "${dest}/Makefile.xezim"
      - name: Fetch test_ara RTL dependencies
        run: bash scripts/fetch_test_ara_rtl.sh
      - name: Run all XIF cocotb suites (xezim)
        env:
          XEZIM_MAX_TIME: 60s
        run: |
          unset PYTHONHOME
          make sim SIM=xezim WAVES=0