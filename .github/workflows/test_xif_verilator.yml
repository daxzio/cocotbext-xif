name: Test cocotbext-xif (Verilator)

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  # Ara OOMs on 5.052+ (ConstVisitor stack). Pin 5.050 for the full suite.
  verilator_5050:
    uses: ./.github/workflows/setup_verilator.yml
    with:
      githash: v5.050

  xif_verilator:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    runs-on: ubuntu-26.04
    needs: verilator_5050

    steps:
      - uses: actions/checkout@v7
      - name: Add Verilator 5.050 to PATH
        run: |
          echo "${{ needs.verilator_5050.outputs.cache_dir }}/bin" >> $GITHUB_PATH
      - name: Report Verilator
        run: verilator --version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system tools
        run: |
          # mold: prebuilt Verilator archives bake -fuse-ld=mold into verilated.mk
          sudo apt-get update
          sudo apt-get install -y ccache mold
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install -e .
      - name: Run all XIF cocotb suites (Verilator)
        run: |
          unset PYTHONHOME
          make sim SIM=verilator WAVES=0