name: Test cocotbext-xif (Verilator)

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  xif_verilator:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    # ubuntu-latest can drift; 26.04 has the prebuilt asset (veryl-lang/setup-verilator#2).
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      # v2 + version: 5.050 returned 404 on ubuntu-26.04 (2026-11). v1 installs
      # a prebuilt Verilator; tests/test_ara still enforces 5.050 via Makefile when possible.
      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v2
      - name: Report Verilator
        run: verilator --version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system tools
        run: |
          # mold: prebuilt Verilator archives bake -fuse-ld=mold into verilated.mk
          sudo apt-get update
          sudo apt-get install -y ccache mold
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install -e .
      - name: Fetch test_ara RTL dependencies
        run: bash scripts/fetch_test_ara_rtl.sh
      - name: Run all XIF cocotb suites (Verilator)
        run: |
          unset PYTHONHOME
          make sim SIM=verilator WAVES=0