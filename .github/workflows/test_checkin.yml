name: Test cocotbext-xif (lint and matrix)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * 0'
jobs:
  run_lint:
    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
      - name: Run lint
        run: |
          make lint
      - name: Run Type check
        run: |
          make mypy

  build_code_rev:

    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        cocotb-version: ["v1.9.2", "v2.0.0"]
        target: [icarus, ghdl]
    runs-on: ubuntu-24.04
    needs: [run_lint]

    env:
      CI_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7
      - name: Report Environment
        run: |
          echo "Runing tests with env set to : ${CI_TARGET}"
      - name: Setup Icarus
        if: matrix.target == 'icarus'
        uses: daxzio/setup-icarus@v1
        with:
          version: "2026.11.04"
      - name: Report Icarus
        if: matrix.target == 'icarus'
        run: iverilog -V
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependency for ghdl
        if: matrix.target == 'ghdl'
        uses: ghdl/setup-ghdl@v1
        with:
          version: nightly
          backend: llvm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y cocotb
          python -m pip install --upgrade git+https://github.com/cocotb/cocotb.git@${{ matrix.cocotb-version }}
      - name: Run Tests verilog
        if: matrix.target == 'icarus'
        #continue-on-error: true
        run: |
          unset PYTHONHOME
          make sim SIM=${CI_TARGET} WAVES=0
      - name: Run Tests VHDL
        if: matrix.target == 'ghdl'
        #continue-on-error: true
        run: |
          unset PYTHONHOME
          make vhdl SIM=${CI_TARGET}

  build_code_master:

    strategy:
      fail-fast: false # So that one fail doesn't stop remaining tests
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        cocotb-version: ["master"]
        target: [icarus, ghdl]
    runs-on: ubuntu-24.04
    needs: [run_lint]

    env:
      CI_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7
      - name: Report Environment
        run: |
          echo "Runing tests with env set to : ${CI_TARGET}"
      - name: Setup Icarus
        if: matrix.target == 'icarus'
        uses: daxzio/setup-icarus@v1
        with:
          version: "2026.11.04"
      - name: Report Icarus
        if: matrix.target == 'icarus'
        run: iverilog -V
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependency for ghdl
        if: matrix.target == 'ghdl'
        uses: ghdl/setup-ghdl@v1
        with:
          version: nightly
          backend: llvm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip install .
          python -m pip uninstall -y cocotb
          python -m pip install --upgrade git+https://github.com/cocotb/cocotb.git@${{ matrix.cocotb-version }}
      - name: Run Tests verilog
        if: matrix.target == 'icarus'
        #continue-on-error: true
        run: |
          unset PYTHONHOME
          make sim SIM=${CI_TARGET} WAVES=0
      - name: Run Tests VHDL
        if: matrix.target == 'ghdl'
        #continue-on-error: true
        run: |
          unset PYTHONHOME
          make vhdl SIM=${CI_TARGET}


#   pypi_release:
#     needs: [build_code_linux]
#     uses: ./.github/workflows/pypy_release.yml
  pypi_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [build_code_rev]
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - name: Make PyPi dist release
        run: make dist
      - name: Publish Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1