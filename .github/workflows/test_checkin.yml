name: Test cocotbext-xif (lint and mypy)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * 0'

jobs:
  run_lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
      - name: Run lint
        run: make lint
      - name: Run Type check
        run: make mypy

# Legacy icarus/ghdl cocotb matrix (make sim / make vhdl) disabled while XIF suites
# are the primary CI path. Re-enable when those entry points match the current tree.
#
#   build_code_rev / build_code_master: matrix python × cocotb × {icarus, ghdl}

  pypi_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [run_lint]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Make PyPi dist release
        run: make dist
      - name: Publish Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1